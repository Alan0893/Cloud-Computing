apiVersion: v1
kind: ServiceAccount
metadata:
  name: hw9-webserver-ksa
  namespace: default
  annotations:
    iam.gke.io/gcp-service-account: ${WEBSERVER_SA}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hw9-webserver
  namespace: default
  labels:
    app: hw9-webserver
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hw9-webserver
  template:
    metadata:
      labels:
        app: hw9-webserver
    spec:
      serviceAccountName: hw9-webserver-ksa
      containers:
      - name: webserver
        image: ${IMAGE}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: PROJECT_ID
          value: "${PROJECT_ID}"
        - name: TOPIC_ID
          value: "${TOPIC_ID}"
        - name: BUCKET_NAME
          value: "${BUCKET_NAME}"
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 15
          failureThreshold: 3
